<html>
<head>
    <title>Border in CSS</title>
    <style>
        body{
        text-align: center;
        background-color: #0000fd;
        }
        h2{
        border: 2px solid black;
        }
        ol{
        display: flex;
        gap: 40px;
        }
        p{
        color: white;
        font-weight: bolder;
        font-style: italic;
        }
        img{
        border: 5px solid red;
        border-radius: 10px;
        width: 400px;
        }
        button{
        width: 100px;
        height: 50px;
        font-size: 20px;
        font-style: italic;
        border: 2px solid red;
        }
        div{
        border: 4px solid red;
        }
    </style>
</head>
<h2>Border in html & css</h2>
<h3>Border Can be used or applied in following components in html, css</h3>
<ol><li>div</li><li>img</li><li>video</li><li>button</li><li>text</li><li>and many more...</li></ol>
<p>Here are some example of it:</p>

<button>Example</button><br>
</div>
</html>
